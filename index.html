<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .con{
            height: 600px;
            
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            display:flex ;
        }
        .left,.right,.center{
            height: 100%;
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 30px;
        }
        .center{
            background-color: whitesmoke;
            width: 62%;
            font-size: 67px;
            color: navy;
        }
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }
        h1{
            margin-left: 20px;
        }
        .right{
            width: 35%;
            border-radius: 20px;
            box-shadow: 10px 10px 10px;
        }
        .top{
            height: 30%;
        }
        .bottom{
            height: 70%;
            align-items: center;
            text-align: center;
        }
        .toping{
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            height: 90%;
            background-color: navy;
        }
        .circle{
            position: absolute;
            top: 90px;
            right: 270px;
            height: 125px;
            width: 125px;
            border-radius: 50%;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;
        }
        .bottom>h1,h2,h3{
            padding-top: 10px;
            text-align: center;
        }
        .icon,.last{
            height: 20%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .button{
            height: 20%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .sub{
            height: 50%;
            width: 40%;
            background-color: navy;
            border-radius: 40px;
            text-align: center;
            color: azure;
            padding-top: 5px;
        }
        .fa-facebook{
            color: blue;
        }
         .fa-instagram{
            color: transparent;
            background: linear-gradient(red, orange);
            background-clip: text;
        }
        .fa-linkedin{
            color: blue;
        }
        .fa-github{
            color: violet ;
        }
        .fa-behance{
            color: green;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="toping">
                        <div class="circle">
                            <img src="Capture4.PNG" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Web Designer</h1>
                    <h2>Dezyne École College </h2>
                    <h2>BCA 1st Year</h2>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-github fa-2x"></i>          
                        <i class="fa fa-brands fa-linkedin fa-2x"></i>
                        <i class="fa fa-brands fa-behance fa-2x"></i>
                    </div>
                    <div class="button">
                        <div class="sub">Subscribe</div>
                        <div class="sub">Message</div>
                    </div>
                    <div class="last">
                        <i class="fa fa-solid fa-heart fa-1x"></i>60.4K
                        <i class="fa fa-solid fa-comment fa-1x"></i>20K
                        <i class="fa fa-solid fa-share fa-flip-horizontal fa-1x"></i>12.6K
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
